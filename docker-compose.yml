version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: bin_essa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bin_essa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BinEssaSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-bin_essa_erp_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/backups
    networks:
      - bin_essa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bin_essa_admin} -d $${POSTGRES_DB:-bin_essa_erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. PgBouncer High-Concurrency Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bin_essa_pgbouncer
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER:-bin_essa_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-BinEssaSecurePass2026!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bin_essa_erp_db}
      LISTEN_PORT: 6432
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-50}
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      ADMIN_USERS: ${POSTGRES_USER:-bin_essa_admin}
      AUTH_TYPE: scram-sha-256


    networks:
      - bin_essa_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U $${DB_USER:-bin_essa_admin} -d $${DB_NAME:-bin_essa_erp_db} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Redis 7 High-Speed Caching Layer
  redis:
    image: redis:7-alpine
    container_name: bin_essa_redis
    restart: always
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - bin_essa_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 4. NestJS Backend Microservice API
  backend:
    image: node:20-alpine
    container_name: bin_essa_backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    command: node dist/src/main.js
    environment:
      PORT: ${BACKEND_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bin_essa_admin}:${POSTGRES_PASSWORD:-BinEssaSecurePass2026!}@pgbouncer:6432/${POSTGRES_DB:-bin_essa_erp_db}?schema=public&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-bin_essa_admin}:${POSTGRES_PASSWORD:-BinEssaSecurePass2026!}@postgres:5432/${POSTGRES_DB:-bin_essa_erp_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-BinEssaSuperSecureJwtSecretKey2026GCC}
    networks:
      - bin_essa_net
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 5. Next.js 16 Production Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: bin_essa_frontend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      INTERNAL_API_URL: http://backend:4000
    networks:
      - bin_essa_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 6. Nginx SSL Reverse Proxy & Load Balancer (Exposes Public Ports 80 / 443 Only)
  nginx:
    image: nginx:alpine
    container_name: bin_essa_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bin_essa_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  bin_essa_net:
    driver: bridge
    name: bin_essa_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backups:
    driver: local
