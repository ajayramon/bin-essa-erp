services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set the pooled Neon DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?Set the direct Neon database URL}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
    expose:
      - "4000"
    networks:
      - bin_essa_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:4000
    expose:
      - "3000"
    networks:
      - bin_essa_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public VPS domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bin_essa_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  bin_essa_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: